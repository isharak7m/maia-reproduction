[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maia-reproduction"
version = "0.1.0"
description = "Reproduction of 'Aligning Superhuman AI with Human Behavior: Chess as a Model System'"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "python-chess>=1.999",
    "zstandard>=0.22",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
